[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_STRIPE_PRICE_MAX,NEXT_PUBLIC_STRIPE_PRICE_PRO,NEXT_PUBLIC_STRIPE_PRICE_BASIC,STRIPE_WEBHOOK_SECRET,NEXTAUTH_URL"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Register sync-cron as a Netlify Scheduled Function (runs every 2 minutes, 24/7)
# Without this block Netlify treats the file as a regular function and NEVER calls it on a schedule.
[[functions]]
  name = "sync-cron"
  schedule = "*/2 * * * *"

# Background functions get a 15-minute timeout instead of the default 10-second limit.
# This is critical — runSync() fetches POP3 emails and calls the AI, which takes > 10s.
[[functions]]
  name = "sync-background"
  timeout = 900
