[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_STRIPE_PRICE_MAX,NEXT_PUBLIC_STRIPE_PRICE_PRO,NEXT_PUBLIC_STRIPE_PRICE_BASIC,STRIPE_WEBHOOK_SECRET,NEXTAUTH_URL"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Scheduled function — fires every 2 minutes, 24/7
[functions."sync-cron"]
  schedule = "*/2 * * * *"

# Background function — 15-minute timeout (default is 10 seconds, too short for POP3 + AI)
[functions."sync-background"]
  timeout = 900
