name: MESKIAI Agent 24/7 Cron

on:
  schedule:
    # Co 5 minut (minimum GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Możliwość ręcznego uruchomienia

jobs:
  ping-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Uruchom agenta AI (sprawdź maile wszystkich użytkowników)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://meskiai.com/api/cron/sync)

          echo "Status odpowiedzi: $response"

          if [ "$response" -eq 200 ]; then
            echo "✅ Agent uruchomiony pomyślnie"
          else
            echo "⚠️ Agent zwrócił status: $response"
            exit 0  # Nie failuj - może być tymczasowy problem
          fi
