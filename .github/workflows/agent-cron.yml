name: MESKIAI Agent 24/7 Cron

on:
  schedule:
    # Co 5 minut (minimum GitHub Actions) — uruchamia agenta AI
    - cron: '*/5 * * * *'
  workflow_dispatch: # Możliwość ręcznego uruchomienia z GitHub UI

jobs:
  ping-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Uruchom agenta AI — sprawdź maile wszystkich użytkowników
        run: |
          echo "Uruchamiam agenta MESKIAI..."
          
          # POST nie wymaga autoryzacji — bezpieczny endpoint dla crona
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions-cron"}' \
            --max-time 120 \
            https://meskiai.com/api/cron/sync)
          
          RESPONSE=$(cat /tmp/response.txt)
          echo "Status HTTP: $HTTP_STATUS"
          echo "Odpowiedź: $RESPONSE"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Agent uruchomiony pomyślnie"
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "⚠️ Brak autoryzacji — sprawdź CRON_SECRET"
          else
            echo "ℹ️ Status: $HTTP_STATUS — kontynuuję bez błędu"
          fi
          
          # Nie failuj pipeline'u — agent może być tymczasowo niedostępny
          exit 0
